<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resell Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxpftSW-VmMVbRwvW9YlFXKxaZDmhVpuE",
      authDomain: "vinted-dashboard-fa829.firebaseapp.com",
      projectId: "vinted-dashboard-fa829",
      storageBucket: "vinted-dashboard-fa829.firebasestorage.app",
      messagingSenderId: "92453414207",
      appId: "1:92453414207:web:6d9a823d2ac0ec29b45f8a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ── State ──────────────────────────────────────────────────────────────
    let items = [];
    let expenses = [];
    let settings = {
      categories: [
        { name:"Women's clothing", prefix:"WMN" },
        { name:"Men's clothing",   prefix:"MEN" },
        { name:"Kids' clothing",   prefix:"KID" },
        { name:"Shoes",            prefix:"SHO" },
        { name:"Bags & accessories", prefix:"BAG" },
        { name:"Jewellery & watches", prefix:"JWL" },
        { name:"Home & garden",    prefix:"HOM" },
        { name:"Books & stationery", prefix:"BOK" },
        { name:"Electronics",      prefix:"ELC" },
        { name:"Entertainment",    prefix:"ENT" },
        { name:"Sports & leisure", prefix:"SPT" },
        { name:"Other",            prefix:"OTH" },
      ],
      sources: ["Charity shop","Car boot sale","Own wardrobe","eBay","Facebook Marketplace","Online","Other"],
      conditions: ["New with tags","Excellent","Good","Satisfactory"],
      statuses: ["Listed","Sold","Donated","Unlisted"],
    };
    let currentView = 'dashboard';
    let editingItem = null;
    let editingExpense = null;
    let sellModal = null;
    let donateModal = null;
    let profitChart = null;
    let statusChart = null;
    let monthlyChart = null;
    let filterStart = '';
    let filterEnd = '';
    let taxYear = getCurrentTaxYear();
    let settingsTab = 'categories';

    function getCurrentTaxYear() {
      const now = new Date();
      const m = now.getMonth(); // 0-indexed
      const y = now.getFullYear();
      return m >= 3 ? y : y - 1; // April = month 3
    }

    function taxYearDates(startYear) {
      return {
        start: new Date(`${startYear}-04-06`),
        end:   new Date(`${startYear+1}-04-05T23:59:59`)
      };
    }

    // ── Firebase listeners ─────────────────────────────────────────────────
    onSnapshot(query(collection(db,"items"), orderBy("dateListed","desc")), snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
    onSnapshot(query(collection(db,"expenses"), orderBy("date","desc")), snap => {
      expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
    onSnapshot(doc(db,"settings","main"), snap => {
      if (snap.exists()) {
        const data = snap.data();
        if (data.categories?.length) settings.categories = data.categories;
        if (data.sources?.length)    settings.sources    = data.sources;
        if (data.conditions?.length) settings.conditions = data.conditions;
        if (data.statuses?.length)   settings.statuses   = data.statuses;
      }
      render();
    });

    async function saveSettings() {
      await updateDoc(doc(db,"settings","main"), settings).catch(async () => {
        await addDoc(collection(db,"settings"), settings);
      });
      // Use set instead
      const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      await setDoc(doc(db,"settings","main"), settings);
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    const fmt    = n  => `£${Number(n||0).toFixed(2)}`;
    const fmtDate = s => s ? new Date(s+'T00:00:00').toLocaleDateString('en-GB') : '—';

    const daysListed = item => {
      if (!item.dateListed) return 0;
      const end = item.dateResolved ? new Date(item.dateResolved+'T00:00:00') : new Date();
      return Math.max(0, Math.round((end - new Date(item.dateListed+'T00:00:00')) / 86400000));
    };

    const profit = item => {
      if (item.status === 'Sold')    return (item.salePrice||0) - (item.buyPrice||0);
      if (item.status === 'Donated') return -(item.buyPrice||0);
      return 0;
    };

    function getCatPrefix(catName) {
      const found = settings.categories.find(c => c.name === catName);
      return found ? found.prefix : 'OTH';
    }

    async function generateSKU(catName) {
      const prefix = getCatPrefix(catName);
      const catItems = items.filter(i => i.sku && i.sku.startsWith(prefix + '-'));
      let max = 0;
      catItems.forEach(i => {
        const parts = i.sku.split('-');
        if (parts.length > 1) {
          const n = parseInt(parts[parts.length-1], 10);
          if (!isNaN(n) && n > max) max = n;
        }
      });
      return `${prefix}-${String(max+1).padStart(3,'0')}`;
    }

    function getFilteredItems() {
      if (!filterStart && !filterEnd) return items;
      return items.filter(i => {
        const d = new Date(i.dateListed||'2000-01-01');
        const s = filterStart ? new Date(filterStart) : new Date('2000-01-01');
        const e = filterEnd   ? new Date(filterEnd)   : new Date('2100-01-01');
        return d >= s && d <= e;
      });
    }

    function calcStats(itemList) {
      const sold     = itemList.filter(i => i.status==='Sold');
      const listed   = itemList.filter(i => i.status==='Listed');
      const donated  = itemList.filter(i => i.status==='Donated');
      const totalSpent   = itemList.reduce((s,i) => s+(i.buyPrice||0), 0);
      const totalEarned  = sold.reduce((s,i) => s+(i.salePrice||0), 0);
      const netProfit    = totalEarned - sold.reduce((s,i) => s+(i.buyPrice||0), 0);
      const totalExpenses = expenses.reduce((s,e) => s+(e.amount||0), 0);
      const trueProfit   = netProfit - totalExpenses;
      const roi          = totalSpent > 0 ? ((totalEarned/totalSpent)-1)*100 : 0;
      const avgDays      = sold.length ? sold.reduce((s,i) => s+daysListed(i),0)/sold.length : 0;
      const sellThrough  = (sold.length+listed.length) > 0 ? (sold.length/(sold.length+listed.length))*100 : 0;
      return { sold:sold.length, listed:listed.length, donated:donated.length,
               totalSpent, totalEarned, netProfit, totalExpenses, trueProfit,
               roi, avgDays, sellThrough, total:itemList.length };
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      const filtered = getFilteredItems();
      const stats    = calcStats(filtered);
      appEl.innerHTML = layout(stats, filtered);
      bindEvents();
      renderCharts(filtered);
    }

    function layout(stats, filtered) {
      return `
        <div class="shell">
          ${sidebar()}
          <div class="main">
            ${topbar()}
            <div class="content">
              ${currentView==='dashboard' ? dashView(stats,filtered)  : ''}
              ${currentView==='inventory' ? inventoryView(filtered)   : ''}
              ${currentView==='expenses'  ? expensesView()            : ''}
              ${currentView==='monthly'   ? monthlyView()             : ''}
              ${currentView==='tax'       ? taxView()                 : ''}
              ${currentView==='settings'  ? settingsView()            : ''}
            </div>
          </div>
        </div>
        ${sellModal   ? sellModalHTML()   : ''}
        ${donateModal ? donateModalHTML() : ''}
      `;
    }

    // ── Sidebar ────────────────────────────────────────────────────────────
    function sidebar() {
      const nav = [
        { id:'dashboard', label:'Dashboard',      icon:'M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z' },
        { id:'inventory', label:'Inventory',      icon:'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z' },
        { id:'monthly',   label:'Monthly Report', icon:'M3 4h18v2H3zm0 7h18v2H3zm0 7h18v2H3z' },
        { id:'tax',       label:'Tax Report',     icon:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z' },
        { id:'expenses',  label:'Expenses',       icon:'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6' },
        { id:'settings',  label:'Settings',       icon:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
      ];
      return `
        <nav class="sidebar">
          <div class="sidebar-logo">
            <div class="logo-mark">RR</div>
            <span class="logo-text">Resell Radar</span>
          </div>
          <div class="nav-label">MENU</div>
          ${nav.map(n => `
            <button class="nav-item ${currentView===n.id?'active':''}" data-view="${n.id}">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${n.icon}"/></svg>
              <span>${n.label}</span>
            </button>`).join('')}
          <div class="sidebar-footer">
            <div class="user-row">
              <div class="user-av">S</div>
              <div><div class="user-name">Stephen</div><div class="user-sub">Reseller</div></div>
            </div>
          </div>
        </nav>`;
    }

    // ── Topbar ─────────────────────────────────────────────────────────────
    function topbar() {
      const labels = { dashboard:'Dashboard', inventory:'Inventory', monthly:'Monthly Report', tax:'Tax Report', expenses:'Expenses', settings:'Settings' };
      const showFilter = currentView==='dashboard'||currentView==='inventory';
      const showAdd    = currentView==='inventory';
      const showAddExp = currentView==='expenses';
      return `
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-toggle" id="menu-toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="page-title">${labels[currentView]||''}</h1>
          </div>
          <div class="topbar-right">
            ${showFilter ? `
              <div class="date-filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="fi"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" id="fs" value="${filterStart}">
                <span class="fsep">—</span>
                <input type="date" id="fe" value="${filterEnd}">
                ${filterStart||filterEnd?`<button class="fclear" id="fclear">✕</button>`:''}
              </div>` : ''}
            ${showAdd    ? `<button class="btn-primary" id="add-item-btn"><span class="plus-icon">+</span> Add Item</button>` : ''}
            ${showAddExp ? `<button class="btn-primary" id="add-exp-btn"><span class="plus-icon">+</span> Add Expense</button>` : ''}
          </div>
        </header>`;
    }

    // ── Dashboard ──────────────────────────────────────────────────────────
    function dashView(stats, filtered) {
      const recentSold = [...items].filter(i=>i.status==='Sold')
        .sort((a,b)=>(b.dateResolved||'').localeCompare(a.dateResolved||'')).slice(0,7);
      return `
        <div class="dash-grid">
          <div class="dash-main">
            <div class="kpi-row">
              ${kpiCard('Total Earned',   fmt(stats.totalEarned),  'green',  earnIcon(),   `ROI: ${stats.roi.toFixed(1)}%`)}
              ${kpiCard('Net Profit',     fmt(stats.netProfit),    stats.netProfit>=0?'teal':'red', profitIcon(), 'After buying costs')}
              ${kpiCard('True Profit',    fmt(stats.trueProfit),   stats.trueProfit>=0?'blue':'red', clockIcon(), 'Incl. all expenses')}
              ${kpiCard('Active Listings',stats.listed,            'amber',  boxIcon(),    `${stats.total} total items`)}
            </div>
            <div class="kpi-row kpi-sm">
              ${kpiSmall('Items Sold',      stats.sold,                        'green')}
              ${kpiSmall('Donated',         stats.donated,                     'purple')}
              ${kpiSmall('Sell-Through',    stats.sellThrough.toFixed(1)+'%',  'teal')}
              ${kpiSmall('Avg Days to Sell',stats.avgDays.toFixed(1)+'d',      'blue')}
              ${kpiSmall('Total Spent',     fmt(stats.totalSpent),             'slate')}
              ${kpiSmall('Expenses',        fmt(stats.totalExpenses),          'red')}
            </div>
            <div class="charts-row">
              <div class="chart-card">
                <div class="ch">
                  <span class="ch-title">Monthly Earnings</span>
                </div>
                <div class="chart-wrap"><canvas id="monthly-chart"></canvas></div>
              </div>
              <div class="chart-card">
                <div class="ch">
                  <span class="ch-title">Profit by Category</span>
                </div>
                <div class="chart-wrap"><canvas id="profit-chart"></canvas></div>
              </div>
            </div>
          </div>
          <div class="dash-side">
            <div class="side-card">
              <div class="ch"><span class="ch-title">Stock Status</span></div>
              <div class="donut-wrap"><canvas id="status-chart"></canvas></div>
              <div class="s-legend">
                <div class="sl"><span class="sd amber"></span>Listed: <strong>${stats.listed}</strong></div>
                <div class="sl"><span class="sd green"></span>Sold: <strong>${stats.sold}</strong></div>
                <div class="sl"><span class="sd purple"></span>Donated: <strong>${stats.donated}</strong></div>
                <div class="sl"><span class="sd grey"></span>Unlisted: <strong>${items.filter(i=>i.status==='Unlisted').length}</strong></div>
              </div>
            </div>
            <div class="side-card">
              <div class="ch"><span class="ch-title">Recent Sales</span></div>
              <div class="recent-list">
                ${recentSold.length ? recentSold.map(i=>`
                  <div class="recent-row">
                    <div class="rinfo">
                      <div class="rname">${i.name||'—'}</div>
                      <div class="rmeta">${fmtDate(i.dateResolved)} · ${i.category||'—'}</div>
                    </div>
                    <div class="rprofit ${profit(i)>=0?'pos':'neg'}">${fmt(profit(i))}</div>
                  </div>`).join('') : '<div class="empty">No sales yet</div>'}
              </div>
            </div>
          </div>
        </div>`;
    }

    const earnIcon  = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`;
    const profitIcon= () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>`;
    const clockIcon = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
    const boxIcon   = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`;

    function kpiCard(label, value, color, icon, sub) {
      return `<div class="kpi-card">
        <div class="kpi-icon ${color}">${icon}</div>
        <div class="kpi-body">
          <div class="kpi-lbl">${label}</div>
          <div class="kpi-val">${value}</div>
          <div class="kpi-sub">${sub}</div>
        </div>
      </div>`;
    }

    function kpiSmall(label, value, color) {
      return `<div class="kpi-sm ${color}">
        <div class="ks-lbl">${label}</div>
        <div class="ks-val">${value}</div>
      </div>`;
    }

    // ── Inventory ──────────────────────────────────────────────────────────
    function inventoryView(filtered) {
      const sorted = [...filtered].sort((a,b) => {
        const o = {Listed:0,Unlisted:1,Sold:2,Donated:3};
        return (o[a.status]||0)-(o[b.status]||0) || (a.dateListed||'').localeCompare(b.dateListed||'');
      });
      return `
        <div class="tcard">
          <div class="thead-row">
            <span class="tcount">${filtered.length} items</span>
            <button class="btn-outline" id="export-csv">↓ Export CSV</button>
          </div>
          <div class="tscroll">
            <table class="dtable">
              <thead><tr>
                <th>SKU</th><th>Item</th><th>Category</th><th>Status</th>
                <th class="num">Buy</th><th class="num">Listed</th><th class="num">Sold For</th>
                <th class="num">Profit</th><th class="num">Days</th><th>Date</th><th>Actions</th>
              </tr></thead>
              <tbody>
                ${sorted.length ? sorted.map(i => {
                  const p = profit(i);
                  const d = daysListed(i);
                  return `<tr>
                    <td class="mono">${i.sku||'—'}</td>
                    <td class="bold-cell">${i.name||'—'}</td>
                    <td><span class="tag">${i.category||'—'}</span></td>
                    <td><span class="sbadge ${(i.status||'').toLowerCase()}">${i.status||'—'}</span></td>
                    <td class="num mono">${fmt(i.buyPrice)}</td>
                    <td class="num mono">${fmt(i.listedPrice)}</td>
                    <td class="num mono">${i.status==='Sold'?fmt(i.salePrice):'—'}</td>
                    <td class="num mono ${i.status==='Sold'||i.status==='Donated'?(p>=0?'pos':'neg'):''}">${i.status==='Sold'||i.status==='Donated'?fmt(p):'—'}</td>
                    <td class="num mono">${d}</td>
                    <td class="mono sm">${fmtDate(i.dateListed)}</td>
                    <td class="act-cell">
                      ${i.status==='Listed'?`
                        <button class="act-sell" data-id="${i.id}" title="Mark as Sold">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                          Sold
                        </button>
                        <button class="act-donate" data-id="${i.id}" title="Mark as Donated">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                          Donate
                        </button>`:''
                      }
                      <button class="act-edit" data-id="${i.id}" title="Edit">✎</button>
                      <button class="act-del"  data-id="${i.id}" title="Delete">✕</button>
                    </td>
                  </tr>`;
                }).join('') : `<tr><td colspan="11" class="empty-row">No items yet — add your first listing above</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
        ${itemModal()}`;
    }

    function itemModal() {
      const i = editingItem || {};
      const isEdit = !!editingItem;
      const catNames = settings.categories.map(c=>c.name);
      return `
        <div class="modal-bg" id="item-modal" style="display:none">
          <div class="modal">
            <div class="mhead"><h3>${isEdit?'Edit Item':'Add New Item'}</h3><button class="mclose" id="close-item">✕</button></div>
            <div class="mbody">
              <div class="fgrid">
                <div class="ff span2">
                  <label>Item Name</label>
                  <input type="text" id="f-name" value="${i.name||''}" placeholder="e.g. Nike Air Max 90 UK9">
                </div>
                <div class="ff">
                  <label>Category</label>
                  <select id="f-cat">${catNames.map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select>
                </div>
                <div class="ff">
                  <label>SKU / ID <span class="lbl-hint">(auto-generated)</span></label>
                  <input type="text" id="f-sku" value="${i.sku||''}" placeholder="Generating…">
                </div>
                <div class="ff">
                  <label>Source</label>
                  <select id="f-source">${settings.sources.map(s=>`<option ${i.source===s?'selected':''}>${s}</option>`).join('')}</select>
                </div>
                <div class="ff">
                  <label>Condition</label>
                  <select id="f-cond">${settings.conditions.map(c=>`<option ${i.condition===c?'selected':''}>${c}</option>`).join('')}</select>
                </div>
                <div class="ff">
                  <label>Buy Price (£)</label>
                  <input type="number" id="f-buy" step="0.01" min="0" value="${i.buyPrice||''}" placeholder="0.00">
                </div>
                <div class="ff">
                  <label>Listed Price (£)</label>
                  <input type="number" id="f-listed" step="0.01" min="0" value="${i.listedPrice||''}" placeholder="0.00">
                </div>
                <div class="ff">
                  <label>Date Listed</label>
                  <input type="date" id="f-date" value="${i.dateListed||new Date().toISOString().split('T')[0]}">
                </div>
                <div class="ff">
                  <label>Status</label>
                  <select id="f-status">${settings.statuses.map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select>
                </div>
                <div class="ff">
                  <label>Date Resolved</label>
                  <input type="date" id="f-resolved" value="${i.dateResolved||''}">
                </div>
                <div class="ff">
                  <label>Sale Price (£)</label>
                  <input type="number" id="f-sale" step="0.01" min="0" value="${i.salePrice||''}" placeholder="0.00">
                </div>
                <div class="ff span2">
                  <label>Notes</label>
                  <textarea id="f-notes" rows="2" placeholder="Listing description or condition notes…">${i.notes||''}</textarea>
                </div>
              </div>
            </div>
            <div class="mfoot">
              <button class="btn-ghost" id="cancel-item">Cancel</button>
              <button class="btn-primary" id="save-item" data-id="${i.id||''}">${isEdit?'Save Changes':'Add Item'}</button>
            </div>
          </div>
        </div>`;
    }

    function sellModalHTML() {
      return `
        <div class="modal-bg" id="sell-modal-wrap">
          <div class="modal modal-sm">
            <div class="mhead"><h3>Mark as Sold</h3><button class="mclose" id="close-sell">✕</button></div>
            <div class="mbody">
              <p class="mdesc">Final sale price for <strong>${sellModal?.name||'this item'}</strong></p>
              <div class="ff"><label>Sale Price (£)</label>

    // ── Monthly ────────────────────────────────────────────────────────────
    function monthlyView() {
      const now = new Date();
      const months = [];
      for (let i=11;i>=0;i--) {
        const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
        months.push({ y:d.getFullYear(), m:d.getMonth(), lbl:d.toLocaleDateString('en-GB',{month:'short',year:'numeric'}) });
      }
      const rows = months.map(mo => {
        const mListed = items.filter(i=>{ const d=i.dateListed?new Date(i.dateListed):null; return d&&d.getFullYear()===mo.y&&d.getMonth()===mo.m; });
        const mSold   = items.filter(i=>{ const d=i.dateResolved?new Date(i.dateResolved):null; return d&&d.getFullYear()===mo.y&&d.getMonth()===mo.m&&i.status==='Sold'; });
        const mDon    = items.filter(i=>{ const d=i.dateResolved?new Date(i.dateResolved):null; return d&&d.getFullYear()===mo.y&&d.getMonth()===mo.m&&i.status==='Donated'; });
        const earned  = mSold.reduce((s,i)=>s+(i.salePrice||0),0);
        const p       = earned - mSold.reduce((s,i)=>s+(i.buyPrice||0),0);
        return { ...mo, listed:mListed.length, sold:mSold.length, donated:mDon.length, earned, profit:p };
      }).reverse();

      const catStats = {};
      settings.categories.forEach(c => {
        const catSold = items.filter(i=>i.category===c.name&&i.status==='Sold');
        const catAll  = items.filter(i=>i.category===c.name);
        catStats[c.name] = {
          listed:  catAll.filter(i=>i.status==='Listed').length,
          sold:    catSold.length,
          donated: catAll.filter(i=>i.status==='Donated').length,
          spent:   catAll.reduce((s,i)=>s+(i.buyPrice||0),0),
          earned:  catSold.reduce((s,i)=>s+(i.salePrice||0),0),
          profit:  catSold.reduce((s,i)=>s+(i.salePrice||0)-(i.buyPrice||0),0),
          avgDays: catSold.length ? catSold.reduce((s,i)=>s+daysListed(i),0)/catSold.length : 0,
        };
      });

      return `
        <div class="monthly-wrap">
          <div class="tcard">
            <div class="thead-row"><span class="ch-title">Month by Month (last 12 months)</span></div>
            <div class="tscroll">
              <table class="dtable">
                <thead><tr><th>Month</th><th class="num">Listed</th><th class="num">Sold</th><th class="num">Donated</th><th class="num">Earned</th><th class="num">Profit</th></tr></thead>
                <tbody>
                  ${rows.map(r=>`<tr>
                    <td class="bold-cell">${r.lbl}</td>
                    <td class="num mono">${r.listed}</td>
                    <td class="num mono">${r.sold}</td>
                    <td class="num mono">${r.donated}</td>
                    <td class="num mono">${fmt(r.earned)}</td>
                    <td class="num mono ${r.profit>=0?'pos':'neg'}">${fmt(r.profit)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
          <div class="tcard" style="margin-top:1.25rem">
            <div class="thead-row"><span class="ch-title">Category Breakdown (All Time)</span></div>
            <div class="tscroll">
              <table class="dtable">
                <thead><tr><th>Category</th><th class="num">Listed</th><th class="num">Sold</th><th class="num">Donated</th><th class="num">Spent</th><th class="num">Earned</th><th class="num">Profit</th><th class="num">Avg Days</th></tr></thead>
                <tbody>
                  ${settings.categories.map(c=>{
                    const s=catStats[c.name]||{};
                    return `<tr>
                      <td class="bold-cell">${c.name}</td>
                      <td class="num mono">${s.listed||0}</td>
                      <td class="num mono">${s.sold||0}</td>
                      <td class="num mono">${s.donated||0}</td>
                      <td class="num mono">${fmt(s.spent)}</td>
                      <td class="num mono">${fmt(s.earned)}</td>
                      <td class="num mono ${(s.profit||0)>0?'pos':(s.profit||0)<0?'neg':''}">${fmt(s.profit)}</td>
                      <td class="num mono">${(s.avgDays||0).toFixed(1)}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    // ── Tax Report ─────────────────────────────────────────────────────────
    function taxView() {
      const { start, end } = taxYearDates(taxYear);
      const tyItems = items.filter(i => {
        if (i.status!=='Sold'&&i.status!=='Donated') return false;
        const d = i.dateResolved ? new Date(i.dateResolved) : null;
        return d && d>=start && d<=end;
      });
      const tySold    = tyItems.filter(i=>i.status==='Sold');
      const tyListed  = items.filter(i=>{ const d=i.dateListed?new Date(i.dateListed):null; return d&&d>=start&&d<=end; });
      const tyExpenses = expenses.filter(e=>{ const d=e.date?new Date(e.date):null; return d&&d>=start&&d<=end; });

      const grossIncome  = tySold.reduce((s,i)=>s+(i.salePrice||0),0);
      const cogsSold     = tySold.reduce((s,i)=>s+(i.buyPrice||0),0);
      const grossProfit  = grossIncome - cogsSold;
      const totalExpAmt  = tyExpenses.reduce((s,e)=>s+(e.amount||0),0);
      const netProfit    = grossProfit - totalExpAmt;
      const ALLOWANCE    = 1000;

      const expByCat = {};
      ['Packaging','Postage','Platform fees','Travel','Equipment','Storage','Other'].forEach(c => {
        expByCat[c] = tyExpenses.filter(e=>e.category===c).reduce((s,e)=>s+(e.amount||0),0);
      });

      const years = [];
      const thisYear = new Date().getFullYear();
      for (let y=thisYear;y>=thisYear-5;y--) years.push(y);

      return `
        <div class="tax-wrap">
          <div class="tax-header">
            <div class="tax-year-sel">
              <label>Tax Year:</label>
              <select id="tax-year-sel">
                ${years.map(y=>`<option value="${y}" ${y===taxYear?'selected':''}>
                  ${y}/${String(y+1).slice(2)} (6 Apr ${y} – 5 Apr ${y+1})
                </option>`).join('')}
              </select>
            </div>
            <div class="tax-disclaimer">⚠ For guidance only. Always consult a qualified accountant.</div>
          </div>

          <div class="tax-grid">
            <div class="tax-section">
              <div class="tax-section-title">INCOME</div>
              ${taxRow('Gross sales income', grossIncome, false, true)}
              ${taxRow('Less: cost of goods sold', -cogsSold, false)}
              ${taxRow('Gross Profit', grossProfit, true)}
            </div>

            <div class="tax-section">
              <div class="tax-section-title">ALLOWABLE EXPENSES</div>
              ${taxRow('Packaging & postage', expByCat['Packaging']+expByCat['Postage'], false)}
              ${taxRow('Platform fees', expByCat['Platform fees'], false)}
              ${taxRow('Travel (sourcing)', expByCat['Travel'], false)}
              ${taxRow('Equipment & storage', expByCat['Equipment']+expByCat['Storage'], false)}
              ${taxRow('Other expenses', expByCat['Other'], false)}
              ${taxRow('Total Allowable Expenses', totalExpAmt, true)}
            </div>

            <div class="tax-section tax-total-section">
              ${taxRow('NET PROFIT / (LOSS)', netProfit, true, false, true)}
            </div>

            <div class="tax-section tax-allowance-section">
              <div class="tax-section-title">TRADING ALLOWANCE CHECK</div>
              ${taxRow('HMRC trading allowance', ALLOWANCE, false, true)}
              ${taxRow('Your gross income this tax year', grossIncome, false, true)}
              <div class="tax-action ${grossIncome>ALLOWANCE?'tax-warn':'tax-ok'}">
                ${grossIncome>ALLOWANCE
                  ? `⚠ Income over £1,000 — you should register as a sole trader and complete a self-assessment`
                  : `✓ Income under £1,000 — no HMRC declaration required for this tax year`}
              </div>
            </div>

            <div class="tax-section">
              <div class="tax-section-title">ACTIVITY SUMMARY (${taxYear}/${taxYear+1})</div>
              <div class="tax-summary-grid">
                <div class="tscard"><div class="tscard-lbl">Items Listed</div><div class="tscard-val">${tyListed.length}</div></div>
                <div class="tscard"><div class="tscard-lbl">Items Sold</div><div class="tscard-val">${tySold.length}</div></div>
                <div class="tscard"><div class="tscard-lbl">Items Donated</div><div class="tscard-val">${tyItems.filter(i=>i.status==='Donated').length}</div></div>
                <div class="tscard"><div class="tscard-lbl">Gross Earned</div><div class="tscard-val">${fmt(grossIncome)}</div></div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function taxRow(label, value, bold=false, positive=false, big=false) {
      const cls = big?'tax-row tax-row-big':bold?'tax-row tax-row-bold':'tax-row';
      const vcls = value<0?'neg':positive?'pos':'';
      return `<div class="${cls}">
        <span>${label}</span>
        <span class="mono ${vcls}">${value<0?`(${fmt(-value)})`:fmt(value)}</span>
      </div>`;
    }

    // ── Charts ─────────────────────────────────────────────────────────────
    function renderCharts(filtered) {
      if (currentView!=='dashboard') return;
      setTimeout(()=>{
        renderProfitChart(filtered);
        renderStatusChart(filtered);
        renderMonthlyChart();
      },50);
    }

    function renderProfitChart(filtered) {
      const canvas = document.getElementById('profit-chart');
      if (!canvas) return;
      if (profitChart) { profitChart.destroy(); profitChart=null; }
      const labels = settings.categories.map(c=>c.name.length>12?c.name.slice(0,12)+'…':c.name);
      const data   = settings.categories.map(c=>{
        const sold = filtered.filter(i=>i.category===c.name&&i.status==='Sold');
        return sold.reduce((s,i)=>s+(i.salePrice||0)-(i.buyPrice||0),0);
      });
      profitChart = new Chart(canvas,{
        type:'bar',
        data:{ labels, datasets:[{ data, backgroundColor:data.map(v=>v>=0?'rgba(26,127,110,0.85)':'rgba(192,57,43,0.85)'), borderRadius:5, borderSkipped:false }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
          scales:{ x:{grid:{display:false},ticks:{color:'#888',font:{size:10,family:'IBM Plex Sans'}}},
                   y:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#888',font:{size:10,family:'IBM Plex Sans'},callback:v=>`£${v}`}} } }
      });
    }

    function renderStatusChart(filtered) {
      const canvas = document.getElementById('status-chart');
      if (!canvas) return;
      if (statusChart) { statusChart.destroy(); statusChart=null; }
      const counts = ['Listed','Sold','Donated','Unlisted'].map(s=>filtered.filter(i=>i.status===s).length);
      statusChart = new Chart(canvas,{
        type:'doughnut',
        data:{ labels:['Listed','Sold','Donated','Unlisted'], datasets:[{ data:counts, backgroundColor:['#D4770A','#2E7D52','#7D3C98','#6B7B79'], borderWidth:0, hoverOffset:6 }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{display:false}} }
      });
    }

    function renderMonthlyChart() {
      const canvas = document.getElementById('monthly-chart');
      if (!canvas) return;
      if (monthlyChart) { monthlyChart.destroy(); monthlyChart=null; }
      const now=new Date(), months=[];
      for (let i=5;i>=0;i--) { const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({lbl:d.toLocaleDateString('en-GB',{month:'short'}),y:d.getFullYear(),m:d.getMonth()}); }
      const earned  = months.map(mo=>items.filter(i=>i.status==='Sold'&&i.dateResolved&&new Date(i.dateResolved).getFullYear()===mo.y&&new Date(i.dateResolved).getMonth()===mo.m).reduce((s,i)=>s+(i.salePrice||0),0));
      const profits = months.map((mo,idx)=>earned[idx]-items.filter(i=>i.status==='Sold'&&i.dateResolved&&new Date(i.dateResolved).getFullYear()===mo.y&&new Date(i.dateResolved).getMonth()===mo.m).reduce((s,i)=>s+(i.buyPrice||0),0));
      monthlyChart = new Chart(canvas,{
        type:'line',
        data:{ labels:months.map(m=>m.lbl), datasets:[
          {label:'Earned',data:earned,borderColor:'#2E7D52',backgroundColor:'rgba(46,125,82,0.07)',fill:true,tension:0.4,pointRadius:4,pointBackgroundColor:'#2E7D52'},
          {label:'Profit',data:profits,borderColor:'#1A7F6E',backgroundColor:'rgba(26,127,110,0.05)',fill:true,tension:0.4,pointRadius:4,pointBackgroundColor:'#1A7F6E'}
        ]},
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'top',labels:{color:'#555',font:{size:10,family:'IBM Plex Sans'},boxWidth:10,usePointStyle:true}}},
          scales:{ x:{grid:{display:false},ticks:{color:'#888',font:{size:10,family:'IBM Plex Sans'}}},
                   y:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#888',font:{size:10,family:'IBM Plex Sans'},callback:v=>`£${v}`}} } }
      });
    }

    // ── Events ─────────────────────────────────────────────────────────────
    function bindEvents() {
      // Navigation
      document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{ currentView=b.dataset.view; render(); }));

      // Mobile menu
      const mt = document.getElementById('menu-toggle');
      if (mt) mt.addEventListener('click',()=>{ document.querySelector('.sidebar')?.classList.toggle('open'); });

      // Date filter
      const fs=document.getElementById('fs'), fe=document.getElementById('fe'), fc=document.getElementById('fclear');
      if (fs) fs.addEventListener('change',e=>{filterStart=e.target.value;render();});
      if (fe) fe.addEventListener('change',e=>{filterEnd=e.target.value;render();});
      if (fc) fc.addEventListener('click',()=>{filterStart='';filterEnd='';render();});

      // Add item
      const aib=document.getElementById('add-item-btn');
      if (aib) aib.addEventListener('click',async()=>{
        editingItem=null;
        render();
        await new Promise(r=>setTimeout(r,10));
        const m=document.getElementById('item-modal');
        if(m){ m.style.display='flex'; }
        // Auto-generate SKU for default category
        const catSel=document.getElementById('f-cat');
        const skuIn=document.getElementById('f-sku');
        if(catSel&&skuIn&&!skuIn.value){
          skuIn.value = await generateSKU(catSel.value);
        }
      });

      // Category change triggers SKU regen
      const catSel=document.getElementById('f-cat');
      if(catSel) catSel.addEventListener('change',async e=>{
        const skuIn=document.getElementById('f-sku');
        if(skuIn&&!editingItem) skuIn.value=await generateSKU(e.target.value);
      });

      // Close/cancel item modal
      ['close-item','cancel-item'].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.addEventListener('click',()=>{ document.getElementById('item-modal').style.display='none'; editingItem=null; });
      });

      // Save item
      const si=document.getElementById('save-item');
      if(si) si.addEventListener('click',async()=>{
        const name=document.getElementById('f-name').value.trim();
        if(!name){alert('Please enter an item name');return;}
        const data={
          name, sku:document.getElementById('f-sku').value.trim(),
          category:document.getElementById('f-cat').value,
          source:document.getElementById('f-source').value,
          condition:document.getElementById('f-cond').value,
          buyPrice:parseFloat(document.getElementById('f-buy').value)||0,
          listedPrice:parseFloat(document.getElementById('f-listed').value)||0,
          dateListed:document.getElementById('f-date').value,
          status:document.getElementById('f-status').value,
          dateResolved:document.getElementById('f-resolved').value||null,
          salePrice:parseFloat(document.getElementById('f-sale').value)||0,
          notes:document.getElementById('f-notes').value.trim(),
          updatedAt:new Date().toISOString(),
        };
        const id=si.dataset.id;
        if(id) await updateDoc(doc(db,'items',id),data);
        else await addDoc(collection(db,'items'),{...data,createdAt:new Date().toISOString()});
        document.getElementById('item-modal').style.display='none';
        editingItem=null;
      });

      // Edit item
      document.querySelectorAll('.act-edit:not(.eedit)').forEach(b=>b.addEventListener('click',()=>{
        editingItem=items.find(i=>i.id===b.dataset.id)||null;
        render();
        setTimeout(()=>{ const m=document.getElementById('item-modal'); if(m) m.style.display='flex'; },10);
      }));

      // Sell button
      document.querySelectorAll('.act-sell').forEach(b=>b.addEventListener('click',()=>{
        sellModal=items.find(i=>i.id===b.dataset.id)||null;
        donateModal=null;
        render();
      }));

      // Donate button
      document.querySelectorAll('.act-donate').forEach(b=>b.addEventListener('click',()=>{
        donateModal=items.find(i=>i.id===b.dataset.id)||null;
        sellModal=null;
        render();
      }));

      // Sell modal
      ['close-sell','cancel-sell'].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.addEventListener('click',()=>{sellModal=null;render();});
      });
      const cs=document.getElementById('confirm-sell');
      if(cs) cs.addEventListener('click',async()=>{
        const price=parseFloat(document.getElementById('sell-price').value)||0;
        const dateVal=document.getElementById('sell-date').value;
        await updateDoc(doc(db,'items',cs.dataset.id),{status:'Sold',salePrice:price,dateResolved:dateVal});
        sellModal=null;render();
      });

      // Donate modal
      ['close-donate','cancel-donate'].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.addEventListener('click',()=>{donateModal=null;render();});
      });
      const cd=document.getElementById('confirm-donate');
      if(cd) cd.addEventListener('click',async()=>{
        const dateVal=document.getElementById('donate-date').value;
        await updateDoc(doc(db,'items',cd.dataset.id),{status:'Donated',dateResolved:dateVal});
        donateModal=null;render();
      });

      // Delete item
      document.querySelectorAll('.act-del:not(.del-cat):not(.del-list):not(.edel)').forEach(b=>b.addEventListener('click',async()=>{
        if(confirm('Delete this item?')) await deleteDoc(doc(db,'items',b.dataset.id));
      }));

      // Expenses
      const aeb=document.getElementById('add-exp-btn');
      if(aeb) aeb.addEventListener('click',()=>{ editingExpense=null; render(); setTimeout(()=>{ const m=document.getElementById('exp-modal'); if(m) m.style.display='flex'; },10); });
      ['close-exp','cancel-exp'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('click',()=>{ document.getElementById('exp-modal').style.display='none'; editingExpense=null; }); });
      document.querySelectorAll('.eedit').forEach(b=>b.addEventListener('click',()=>{ editingExpense=expenses.find(e=>e.id===b.dataset.id)||null; render(); setTimeout(()=>{ const m=document.getElementById('exp-modal'); if(m) m.style.display='flex'; },10); }));
      document.querySelectorAll('.edel').forEach(b=>b.addEventListener('click',async()=>{ if(confirm('Delete this expense?')) await deleteDoc(doc(db,'expenses',b.dataset.id)); }));
      const se=document.getElementById('save-exp');
      if(se) se.addEventListener('click',async()=>{
        const desc=document.getElementById('ef-desc').value.trim();
        if(!desc){alert('Please enter a description');return;}
        const data={ description:desc, category:document.getElementById('ef-cat').value, amount:parseFloat(document.getElementById('ef-amount').value)||0, date:document.getElementById('ef-date').value, notes:document.getElementById('ef-notes').value.trim(), taxDeductible:document.getElementById('ef-tax').checked, receipt:document.getElementById('ef-receipt').checked };
        const id=se.dataset.id;
        if(id) await updateDoc(doc(db,'expenses',id),data);
        else await addDoc(collection(db,'expenses'),data);
        document.getElementById('exp-modal').style.display='none';
        editingExpense=null;
      });

      // Tax year
      const tys=document.getElementById('tax-year-sel');
      if(tys) tys.addEventListener('change',e=>{ taxYear=parseInt(e.target.value); render(); });

      // Settings tabs
      document.querySelectorAll('.stab').forEach(b=>b.addEventListener('click',()=>{ settingsTab=b.dataset.stab; render(); }));

      // Settings — categories
      document.querySelectorAll('input[data-cat-name]').forEach(inp=>inp.addEventListener('change',e=>{ settings.categories[e.target.dataset.catName].name=e.target.value; }));
      document.querySelectorAll('input[data-cat-prefix]').forEach(inp=>inp.addEventListener('change',e=>{ settings.categories[e.target.dataset.catPrefix].prefix=e.target.value.toUpperCase(); }));
      document.querySelectorAll('.del-cat').forEach(b=>b.addEventListener('click',()=>{ settings.categories.splice(parseInt(b.dataset.catIdx),1); render(); }));
      const acb=document.getElementById('add-cat-btn');
      if(acb) acb.addEventListener('click',()=>{
        const n=document.getElementById('new-cat-name').value.trim();
        const p=document.getElementById('new-cat-prefix').value.trim().toUpperCase();
        if(!n||!p){alert('Enter both a name and a prefix');return;}
        settings.categories.push({name:n,prefix:p});
        render();
      });

      // Settings — simple lists
      document.querySelectorAll('input[data-list]').forEach(inp=>inp.addEventListener('change',e=>{
        const key=e.target.dataset.list, idx=parseInt(e.target.dataset.idx);
        settings[key][idx]=e.target.value;
      }));
      document.querySelectorAll('.del-list').forEach(b=>b.addEventListener('click',()=>{
        settings[b.dataset.list].splice(parseInt(b.dataset.idx),1); render();
      }));
      ['sources','conditions','statuses'].forEach(key=>{
        const btn=document.getElementById(`add-${key}-btn`);
        if(btn) btn.addEventListener('click',()=>{
          const val=document.getElementById(`new-${key}`).value.trim();
          if(!val) return;
          settings[key].push(val); render();
        });
      });

      // Save settings
      const ssb=document.getElementById('save-settings-btn');
      if(ssb) ssb.addEventListener('click',async()=>{
        await saveSettings();
        const sc=document.getElementById('save-confirm');
        if(sc){ sc.style.display='inline'; setTimeout(()=>sc.style.display='none',2500); }
      });

      // Export CSV
      const ecb=document.getElementById('export-csv');
      if(ecb) ecb.addEventListener('click',()=>{
        const hdrs=['SKU','Name','Category','Source','Condition','Buy Price','Listed Price','Sale Price','Profit','Status','Date Listed','Date Resolved','Days Listed','Notes'];
        const rows=items.map(i=>[i.sku,`"${(i.name||'').replace(/"/g,'""')}"`,i.category,i.source,i.condition,i.buyPrice,i.listedPrice,i.salePrice||'',profit(i).toFixed(2),i.status,i.dateListed,i.dateResolved||'',daysListed(i),`"${(i.notes||'').replace(/"/g,'""')}"`].join(','));
        const csv='data:text/csv;charset=utf-8,'+[hdrs.join(','),...rows].join('\n');
        const a=document.createElement('a');a.href=encodeURI(csv);a.download='resell-radar.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
      });

      // Modal backdrop close
      document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{
        if(e.target===bg){ bg.style.display='none'; editingItem=null; editingExpense=null; sellModal=null; donateModal=null; }
      }));
    }

    window.addEventListener('DOMContentLoaded',()=>render());
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --sw:220px;
      --teal:#1A7F6E;--teal-l:#E6F4F1;
      --dark:#0F1B1A;--dark2:#1C2B2A;
      --white:#fff;
      --g50:#F7FAF9;--g100:#EEF3F2;--g200:#D8E3E1;--g400:#8FA8A4;--g600:#4E6B67;
      --green:#2E7D52;--green-l:#E8F5EE;
      --red:#B83030;--red-l:#FDEAEA;
      --amber:#C96D0A;--amber-l:#FEF0E0;
      --blue:#1A4F7A;--blue-l:#E8F1FA;
      --purple:#6B3490;--purple-l:#F3EDF8;
      --r:10px;--rs:7px;
      --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
      --sh-md:0 4px 16px rgba(0,0,0,.1);
    }
    body{font-family:'IBM Plex Sans',sans-serif;background:var(--g50);color:var(--dark);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    .shell{display:flex;min-height:100vh;}

    /* Sidebar */
    .sidebar{width:var(--sw);background:var(--dark2);display:flex;flex-direction:column;padding-bottom:1rem;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s ease;}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:1.2rem 1.2rem .9rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:.6rem;}
    .logo-mark{width:32px;height:32px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:#fff;letter-spacing:.04em;flex-shrink:0;}
    .logo-text{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.01em;}
    .nav-label{font-size:10px;font-weight:600;color:var(--g400);letter-spacing:.1em;padding:0 1.2rem .4rem;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:.6rem 1.2rem;color:rgba(255,255,255,.55);background:none;border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:13px;width:100%;text-align:left;position:relative;transition:all .15s;}
    .nav-item:hover{color:#fff;background:rgba(255,255,255,.05);}
    .nav-item.active{color:#fff;background:rgba(26,127,110,.18);}
    .nav-item.active::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--teal);border-radius:0 3px 3px 0;}
    .nav-icon{width:16px;height:16px;flex-shrink:0;}
    .sidebar-footer{margin-top:auto;padding:.9rem 1.2rem 0;border-top:1px solid rgba(255,255,255,.08);}
    .user-row{display:flex;align-items:center;gap:10px;}
    .user-av{width:30px;height:30px;background:var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;color:#fff;}
    .user-sub{font-size:11px;color:var(--g400);}

    /* Main */
    .main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh;}

    /* Topbar */
    .topbar{background:#fff;border-bottom:1px solid var(--g200);padding:0 1.5rem;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:1rem;}
    .topbar-left{display:flex;align-items:center;gap:.75rem;}
    .menu-toggle{display:none;background:none;border:none;cursor:pointer;color:var(--g600);padding:4px;}
    .menu-toggle svg{width:20px;height:20px;}
    .page-title{font-size:15px;font-weight:600;color:var(--dark);letter-spacing:-.02em;}
    .topbar-right{display:flex;align-items:center;gap:.75rem;}
    .date-filter{display:flex;align-items:center;gap:.4rem;background:var(--g100);border:1px solid var(--g200);border-radius:var(--rs);padding:.35rem .7rem;}
    .fi{width:13px;height:13px;color:var(--g400);flex-shrink:0;}
    .date-filter input{background:none;border:none;outline:none;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--dark);}
    .fsep{color:var(--g400);font-size:12px;}
    .fclear{background:none;border:none;cursor:pointer;color:var(--g400);font-size:12px;padding-left:4px;transition:color .15s;}
    .fclear:hover{color:var(--red);}
    .plus-icon{font-size:16px;font-weight:300;line-height:1;}

    /* Buttons */
    .btn-primary{display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:none;border-radius:var(--rs);padding:.48rem .95rem;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
    .btn-primary:hover{background:#15695A;}
    .btn-primary.green{background:var(--green);}
    .btn-primary.green:hover{background:#256645;}
    .btn-primary.purple{background:var(--purple);}
    .btn-primary.purple:hover{background:#572878;}
    .btn-outline{display:flex;align-items:center;gap:5px;background:#fff;color:var(--g600);border:1px solid var(--g200);border-radius:var(--rs);padding:.42rem .8rem;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
    .btn-outline:hover{border-color:var(--g400);color:var(--dark);}
    .btn-ghost{background:none;border:none;color:var(--g600);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;padding:.48rem .95rem;border-radius:var(--rs);transition:all .15s;}
    .btn-ghost:hover{background:var(--g100);color:var(--dark);}

    /* Content */
    .content{padding:1.4rem;}

    /* Dashboard */
    .dash-grid{display:grid;grid-template-columns:1fr 310px;gap:1.2rem;}
    .dash-main{display:flex;flex-direction:column;gap:1.2rem;}
    .dash-side{display:flex;flex-direction:column;gap:1.2rem;}
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;}
    .kpi-card{background:#fff;border-radius:var(--r);padding:1rem 1.1rem;display:flex;align-items:flex-start;gap:.9rem;box-shadow:var(--sh);border:1px solid var(--g100);}
    .kpi-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .kpi-icon svg{width:17px;height:17px;}
    .kpi-icon.green{background:var(--green-l);color:var(--green);}
    .kpi-icon.teal{background:var(--teal-l);color:var(--teal);}
    .kpi-icon.amber{background:var(--amber-l);color:var(--amber);}
    .kpi-icon.blue{background:var(--blue-l);color:var(--blue);}
    .kpi-icon.red{background:var(--red-l);color:var(--red);}
    .kpi-lbl{font-size:11.5px;color:var(--g600);margin-bottom:2px;}
    .kpi-val{font-size:21px;font-weight:600;color:var(--dark);letter-spacing:-.03em;font-family:'IBM Plex Mono',monospace;line-height:1.15;}
    .kpi-sub{font-size:11px;color:var(--g400);margin-top:3px;}
    .kpi-sm{display:grid;grid-template-columns:repeat(6,1fr);gap:.85rem;}
    .kpi-sm.kpi-sm{} /* specificity */
    .kpi-small{background:#fff;border-radius:var(--rs);padding:.8rem .9rem;box-shadow:var(--sh);border:1px solid var(--g100);border-top:2px solid transparent;}
    .kpi-small.green{border-top-color:var(--green);}
    .kpi-small.teal{border-top-color:var(--teal);}
    .kpi-small.amber{border-top-color:var(--amber);}
    .kpi-small.blue{border-top-color:var(--blue);}
    .kpi-small.purple{border-top-color:var(--purple);}
    .kpi-small.red{border-top-color:var(--red);}
    .kpi-small.slate{border-top-color:var(--g400);}
    .ks-lbl{font-size:10.5px;color:var(--g600);margin-bottom:3px;}
    .ks-val{font-size:16px;font-weight:600;color:var(--dark);letter-spacing:-.02em;font-family:'IBM Plex Mono',monospace;}
    .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
    .chart-card,.side-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--g100);overflow:hidden;}
    .ch{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem .7rem;border-bottom:1px solid var(--g100);}
    .ch-title{font-size:12.5px;font-weight:600;color:var(--dark);letter-spacing:-.01em;}
    .chart-wrap{padding:.9rem;height:195px;}
    .donut-wrap{padding:.9rem;height:155px;}
    .s-legend{padding:.6rem 1.1rem .9rem;display:flex;flex-direction:column;gap:.35rem;}
    .sl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--g600);}
    .sl strong{color:var(--dark);}
    .sd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .sd.amber{background:var(--amber);}
    .sd.green{background:var(--green);}
    .sd.purple{background:var(--purple);}
    .sd.grey{background:var(--g400);}
    .recent-list{padding:.3rem 0;}
    .recent-row{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.1rem;transition:background .1s;}
    .recent-row:hover{background:var(--g50);}
    .rname{font-size:12.5px;font-weight:500;color:var(--dark);}
    .rmeta{font-size:11px;color:var(--g400);margin-top:1px;}
    .rprofit{font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
    .pos{color:var(--green);}
    .neg{color:var(--red);}

    /* Tables */
    .tcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--g100);overflow:hidden;}
    .thead-row{padding:.9rem 1.1rem;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;}
    .tcount{font-size:12.5px;color:var(--g600);}
    .tscroll{overflow-x:auto;}
    .dtable{width:100%;border-collapse:collapse;min-width:760px;}
    .dtable th{padding:.55rem .9rem;font-size:10.5px;font-weight:600;color:var(--g400);text-align:left;background:var(--g50);border-bottom:1px solid var(--g200);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
    .dtable td{padding:.7rem .9rem;font-size:13px;color:var(--dark);border-bottom:1px solid var(--g100);vertical-align:middle;}
    .dtable tr:last-child td{border-bottom:none;}
    .dtable tr:hover td{background:var(--g50);}
    .dtable th.num,.dtable td.num{text-align:right;}
    .mono{font-family:'IBM Plex Mono',monospace;font-size:12px;}
    .sm{font-size:12px;}
    .bold-cell{font-weight:500;}
    .tag{display:inline-block;padding:2px 8px;background:var(--g100);border-radius:99px;font-size:11px;color:var(--g600);white-space:nowrap;}
    .sbadge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;}
    .sbadge.listed{background:var(--amber-l);color:var(--amber);}
    .sbadge.sold{background:var(--green-l);color:var(--green);}
    .sbadge.donated{background:var(--purple-l);color:var(--purple);}
    .sbadge.unlisted{background:var(--g100);color:var(--g600);}
    .chk{color:var(--green);font-weight:600;}
    .empty-row{text-align:center;color:var(--g400);padding:2.5rem!important;}
    .empty{padding:1.2rem 1.1rem;color:var(--g400);font-size:13px;}

    /* Action buttons */
    .act-cell{white-space:nowrap;}
    .act-sell,.act-donate{display:inline-flex;align-items:center;gap:5px;padding:.35rem .7rem;border:none;border-radius:var(--rs);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;transition:all .15s;margin-right:4px;}
    .act-sell svg,.act-donate svg{width:13px;height:13px;}
    .act-sell{background:var(--green-l);color:var(--green);border:1px solid rgba(46,125,82,.2);}
    .act-sell:hover{background:#d0edda;}
    .act-donate{background:var(--purple-l);color:var(--purple);border:1px solid rgba(107,52,144,.2);}
    .act-donate:hover{background:#ebe4f2;}
    .act-edit,.act-del{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;border-radius:var(--rs);cursor:pointer;font-size:12px;background:none;color:var(--g400);transition:all .15s;}
    .act-edit:hover{background:var(--blue-l);color:var(--blue);}
    .act-del:hover{background:var(--red-l);color:var(--red);}

    /* Expenses */
    .exp-layout{display:grid;grid-template-columns:1fr 230px;gap:1.2rem;align-items:start;}
    .exp-side .side-card{padding:1rem;}
    .ecat-row{display:flex;justify-content:space-between;align-items:center;padding:.42rem 0;font-size:12.5px;border-bottom:1px solid var(--g100);}
    .ecat-row:last-child{border-bottom:none;}
    .ecat-total{font-weight:600;border-top:2px solid var(--g200);margin-top:.3rem;padding-top:.5rem;}

    /* Monthly */
    .monthly-wrap{display:flex;flex-direction:column;gap:1.2rem;}

    /* Tax */
    .tax-wrap{display:flex;flex-direction:column;gap:1.2rem;}
    .tax-header{background:#fff;border-radius:var(--r);padding:1rem 1.2rem;box-shadow:var(--sh);border:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;}
    .tax-year-sel{display:flex;align-items:center;gap:.75rem;}
    .tax-year-sel label{font-size:13px;font-weight:500;color:var(--dark);}
    .tax-year-sel select{padding:.45rem .75rem;border:1px solid var(--g200);border-radius:var(--rs);font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--dark);background:#fff;outline:none;}
    .tax-year-sel select:focus{border-color:var(--teal);}
    .tax-disclaimer{font-size:11px;color:var(--amber);background:var(--amber-l);padding:.4rem .8rem;border-radius:var(--rs);}
    .tax-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
    .tax-section{background:#fff;border-radius:var(--r);padding:1.2rem;box-shadow:var(--sh);border:1px solid var(--g100);}
    .tax-section-title{font-size:10.5px;font-weight:600;color:var(--g400);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem;}
    .tax-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;font-size:13px;border-bottom:1px solid var(--g100);}
    .tax-row:last-child{border-bottom:none;}
    .tax-row.tax-row-bold{font-weight:600;color:var(--dark);}
    .tax-row.tax-row-big{font-size:16px;font-weight:700;color:var(--dark);padding:.6rem 0;}
    .tax-total-section{grid-column:span 2;background:var(--dark2);border-color:var(--dark2);}
    .tax-total-section .tax-section-title{color:rgba(255,255,255,.4);}
    .tax-total-section .tax-row-big{color:#fff;}
    .tax-total-section .mono{color:#fff;}
    .tax-total-section .pos{color:#6BCF8C;}
    .tax-total-section .neg{color:#F4908A;}
    .tax-allowance-section{grid-column:span 2;}
    .tax-action{margin-top:.9rem;padding:.75rem 1rem;border-radius:var(--rs);font-size:13px;font-weight:500;}
    .tax-warn{background:var(--amber-l);color:var(--amber);}
    .tax-ok{background:var(--green-l);color:var(--green);}
    .tax-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:.5rem;}
    .tscard{background:var(--g50);border-radius:var(--rs);padding:.75rem;border:1px solid var(--g100);}
    .tscard-lbl{font-size:11px;color:var(--g600);margin-bottom:3px;}
    .tscard-val{font-size:16px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--dark);}

    /* Settings */
    .settings-wrap{display:flex;flex-direction:column;gap:1rem;}
    .settings-tabs{display:flex;gap:.5rem;background:#fff;border-radius:var(--r);padding:.6rem;box-shadow:var(--sh);border:1px solid var(--g100);}
    .stab{padding:.45rem 1rem;border:none;border-radius:var(--rs);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;color:var(--g600);background:none;transition:all .15s;}
    .stab:hover{background:var(--g100);color:var(--dark);}
    .stab.active{background:var(--teal);color:#fff;}
    .scard{background:#fff;border-radius:var(--r);padding:1.2rem;box-shadow:var(--sh);border:1px solid var(--g100);}
    .scard-header{margin-bottom:1rem;}
    .scard-header span{font-size:14px;font-weight:600;color:var(--dark);}
    .scard-hint{font-size:12px;color:var(--g400);margin-top:.3rem;}
    .sinput{padding:.45rem .65rem;border:1px solid var(--g200);border-radius:var(--rs);font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--dark);background:#fff;outline:none;width:100%;transition:border-color .15s;}
    .sinput:focus{border-color:var(--teal);}
    .prefix-input{width:80px;text-transform:uppercase;}
    .sadd-row{display:flex;gap:.6rem;margin-top:1rem;align-items:center;}
    .sadd-row .sinput{flex:1;}
    .ssave-row{display:flex;align-items:center;gap:.75rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--g100);}
    .save-confirm{font-size:13px;color:var(--green);font-weight:500;}
    .slist{display:flex;flex-direction:column;gap:.5rem;}
    .slist-row{display:flex;align-items:center;gap:.5rem;}
    .slist-row .sinput{flex:1;}
    .lbl-hint{font-size:10px;color:var(--g400);font-weight:400;text-transform:none;letter-spacing:0;}

    /* Modals */
    .modal-bg{position:fixed;inset:0;background:rgba(15,27,26,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;backdrop-filter:blur(3px);}
    .modal{background:#fff;border-radius:var(--r);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-md);}
    .modal.modal-sm{max-width:400px;}
    .mhead{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--g100);}
    .mhead h3{font-size:14px;font-weight:600;color:var(--dark);}
    .mclose{background:none;border:none;cursor:pointer;color:var(--g400);font-size:14px;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .mclose:hover{background:var(--g100);color:var(--dark);}
    .mbody{padding:1.4rem;}
    .mdesc{font-size:13px;color:var(--g600);margin-bottom:.9rem;}
    .mdesc-sub{font-size:12px;color:var(--red);margin-top:-.4rem;margin-bottom:.75rem;}
    .mfoot{display:flex;justify-content:flex-end;gap:.5rem;padding:.9rem 1.4rem;border-top:1px solid var(--g100);}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
    .ff{display:flex;flex-direction:column;gap:4px;}
    .ff.span2{grid-column:span 2;}
    .ff.cb-ff{justify-content:flex-end;}
    .ff label{font-size:10.5px;font-weight:600;color:var(--g600);text-transform:uppercase;letter-spacing:.05em;}
    .ff input,.ff select,.ff textarea{padding:.48rem .65rem;border:1px solid var(--g200);border-radius:var(--rs);font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--dark);background:#fff;outline:none;transition:border-color .15s;}
    .ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,127,110,.1);}
    .ff textarea{resize:vertical;}
    .ff input[type="checkbox"]{width:15px;height:15px;padding:0;accent-color:var(--teal);}
    .cb-ff label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--dark);cursor:pointer;}

    /* Responsive */
    @media(max-width:1200px){
      .dash-grid{grid-template-columns:1fr;}
      .dash-side{display:grid;grid-template-columns:1fr 1fr;}
      .kpi-sm{grid-template-columns:repeat(3,1fr);}
      .tax-grid{grid-template-columns:1fr;}
      .tax-total-section,.tax-allowance-section{grid-column:span 1;}
      .tax-summary-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:900px){
      :root{--sw:0px;}
      .sidebar{transform:translateX(-220px);width:220px;}
      .sidebar.open{transform:translateX(0);}
      .main{margin-left:0;}
      .menu-toggle{display:flex;}
      .kpi-row{grid-template-columns:repeat(2,1fr);}
      .kpi-sm{grid-template-columns:repeat(2,1fr);}
      .charts-row{grid-template-columns:1fr;}
      .exp-layout{grid-template-columns:1fr;}
      .topbar{padding:0 1rem;}
      .content{padding:1rem;}
    }
    @media(max-width:600px){
      .kpi-row{grid-template-columns:1fr 1fr;}
      .fgrid{grid-template-columns:1fr;}
      .ff.span2{grid-column:span 1;}
      .date-filter{display:none;}
      .tax-summary-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
